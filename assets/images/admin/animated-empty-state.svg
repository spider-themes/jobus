<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
	<style>
		.bg { fill: #31795A; opacity: 0.05; }
		.stroke-main { stroke: #31795A; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
		.stroke-light { stroke: #2EA268; stroke-width: 2; stroke-linecap: round; fill: none; }
		
		@keyframes float {
			0%, 100% { transform: translateY(0); }
			50% { transform: translateY(-6px); }
		}
		
		@keyframes drop {
			0% { transform: translateY(-10px); opacity: 0; }
			25% { opacity: 1; }
			75% { transform: translateY(12px); opacity: 0; }
			100% { transform: translateY(12px); opacity: 0; }
		}

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0; }
        }

		.cloud-group { animation: float 4s ease-in-out infinite; }
		.arrow { animation: drop 2s infinite cubic-bezier(0.4, 0, 0.2, 1); }
        .ring { animation: pulse-ring 2s infinite ease-out; transform-origin: 60px 85px; }
	</style>

	<!-- Soft Background -->
	<circle cx="60" cy="60" r="50" class="bg" />
    <ellipse cx="60" cy="85" rx="18" ry="6" class="stroke-light ring" />

	<g class="cloud-group">
		<!-- 3D Platform/Base -->
		<path d="M 35 80 L 60 92 L 85 80 L 60 68 Z" class="stroke-main" fill="#ffffff" />
		<path d="M 35 80 L 35 88 L 60 100 L 85 88 L 85 80" class="stroke-main" fill="#E6F0EB" />
		
		<!-- Cloud Structure -->
		<path d="M 40 50 C 35 45, 45 35, 55 35 C 60 25, 75 25, 80 35 C 90 40, 90 55, 80 60 L 35 60 C 25 55, 25 45, 35 50 Z" class="stroke-main" fill="#ffffff" />
		
		<!-- Animated Download Arrow dropping from cloud into box -->
		<g class="arrow">
			<line x1="60" y1="45" x2="60" y2="60" class="stroke-main" />
			<polyline points="53,53 60,60 67,53" class="stroke-main" />
		</g>
	</g>
</svg>
